name: Acceptance tests
on: [push, pull_request]
jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sherlock_test
          POSTGRES_USER: sherlock
          POSTGRES_PASSWORD: test-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sherlock"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://sherlock:test-only@localhost:5432/sherlock_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: docker compose up --build -d --wait
      - run: curl --fail --retry 20 --retry-delay 3 --retry-connrefused http://localhost:8000/health
      - if: always()
        run: docker compose logs
