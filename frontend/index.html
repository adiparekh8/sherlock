<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sherlock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = { corePlugins: { preflight: false } }</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<link rel="stylesheet" href="https://api.mapbox.com/mapbox-gl-js/v3.33.0/mapbox-gl.css">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.33.0/mapbox-gl.js"></script>
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<div id="progress"></div>
<div class="loading-screen" id="loading-screen" aria-live="polite" aria-hidden="true"><div class="mouse-orbit" id="mouse-orbit"></div><div class="loading-copy"><b>Sherlock is searching</b></div></div>
<dialog class="set-dialog" id="set-dialog" aria-labelledby="set-dialog-title">
  <form id="set-form" method="dialog">
    <div class="set-dialog-copy">
      <p class="eyebrow">New document set</p>
      <h2 id="set-dialog-title">Name this document set</h2>
      <p>Files and records in this set stay separate from every other worker’s set.</p>
    </div>
    <label class="smooth-input" for="set-name">
      <span class="sr-only">Document set name</span>
      <input id="set-name" name="name" type="text" maxlength="80" autocomplete="off" placeholder="e.g. November imports" required>
    </label>
    <p class="set-error" id="set-error" role="alert"></p>
    <div class="set-dialog-actions">
      <button class="btn" type="button" data-new-set-cancel>Cancel</button>
      <button class="btn primary" id="set-submit" type="submit">Create set</button>
    </div>
  </form>
</dialog>
<div class="shell">
  <aside class="sidebar">
    <div class="wordmark"><i class="mark"></i><span>Sherlock</span></div>
    <div class="dataset dataset-seed">
      <label for="dataset">Dataset</label>
      <select id="dataset"></select>
    </div>
    <nav class="nav" id="nav" aria-label="Main navigation"></nav>
    <div class="dataset reviewer">
      <label for="reviewer">Reviewer</label>
      <input id="reviewer" placeholder="Your name" autocomplete="off">
    </div>
    <div class="foot" id="foot"></div>
  </aside>
  <div>
    <header class="topbar" id="topbar"></header>
    <main id="main"><div class="empty">Loading…</div></main>
  </div>
</div>
<script src="/static/app.js"></script>
</body>
</html>
